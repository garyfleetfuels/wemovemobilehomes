<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 300">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&amp;display=swap');
      .brand-title {
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 900;
        font-size: 68px;
        letter-spacing: -1.5px;
      }
      .brand-subtitle {
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 27px;
        letter-spacing: 2.5px;
        fill: #475569;
      }
    </style>
  </defs>

  <!-- ICON GROUP -->
  <g transform="translate(15, 10)">
    <!-- Outer Charcoal Swoosh -->
    <path fill="#0F172A" d="M 95,125 C -15,165 -20,275 110,275 C 175,275 245,250 295,220 L 305,245 L 345,170 L 255,178 L 270,195 C 220,222 160,242 105,242 C 25,242 15,175 100,135 Z" />
    
    <!-- Red Main Swoosh Arrow -->
    <path fill="#C8102E" d="M 105,115 C 5,152 0,258 115,258 C 175,258 240,235 288,206 L 296,222 L 332,173 L 258,180 L 272,193 C 225,218 168,236 115,236 C 35,236 28,168 110,126 Z" />

    <!-- Inner Grey Accent Swoosh -->
    <path fill="#64748B" d="M 110,138 C 45,168 42,222 98,232 C 62,218 65,175 115,146 Z" />

    <!-- Road Base Under Truck -->
    <path fill="#0F172A" d="M 75,185 C 145,165 260,135 425,130 C 330,142 210,168 140,208 L 90,208 C 78,205 72,195 75,185 Z" />
    
    <!-- Red Road Dashes -->
    <polygon fill="#C8102E" points="350,158 380,154 388,144 358,148" />
    <polygon fill="#C8102E" points="395,152 415,149 422,141 402,144" />
    <polygon fill="#C8102E" points="85,204 115,192 130,192 102,205" />

    <!-- Speed Lines Left -->
    <polygon fill="#0F172A" points="55,75 105,68 105,76" />
    <polygon fill="#0F172A" points="68,88 105,83 105,90" />
    <polygon fill="#C8102E" points="60,106 75,103 76,110 61,113" />

    <!-- Flatbed Truck & Trailer -->
    <g transform="rotate(-7, 240, 120)">
      <!-- Main Roof -->
      <polygon fill="#0F172A" points="105,40 295,5 375,60 365,68 295,18 112,50" />
      <!-- Chimney -->
      <rect fill="#0F172A" x="150" y="18" width="12" height="20" />

      <!-- Left Section (Light Grey Wall) -->
      <polygon fill="#E2E8F0" points="118,48 230,30 230,115 118,125" />
      <rect fill="#0F172A" x="128" y="65" width="14" height="28" />
      <rect fill="#0F172A" x="145" y="63" width="14" height="28" />
      <polygon fill="#0F172A" points="168,58 186,56 186,118 168,120" />
      <rect fill="#0F172A" x="196" y="55" width="16" height="30" />

      <!-- Middle Gable Section (Grey) -->
      <polygon fill="#64748B" points="232,45 272,22 312,48 312,110 232,115" />
      <polygon fill="#0F172A" points="226,47 272,17 318,49 313,54 272,26 231,52" />
      <rect fill="#FFFFFF" x="242" y="50" width="12" height="36" />
      <rect fill="#FFFFFF" x="258" y="48" width="24" height="38" />
      <rect fill="#FFFFFF" x="286" y="50" width="12" height="36" />

      <!-- Right Gable Section (Red) -->
      <polygon fill="#C8102E" points="312,24 295,14 362,58 362,106 312,110" />
      <rect fill="#FFFFFF" x="328" y="52" width="18" height="32" />

      <!-- Home Base Frame -->
      <polygon fill="#0F172A" points="112,122 368,104 368,112 112,130" />

      <!-- Truck Flatbed & Cab -->
      <path fill="#0F172A" d="M 95,134 L 375,114 L 375,68 L 408,68 C 415,68 422,75 426,88 L 432,112 L 432,135 L 95,156 Z" />
      <!-- Cab Window -->
      <path fill="#FFFFFF" d="M 384,76 L 405,76 C 410,76 415,82 418,92 L 420,102 L 384,96 Z" />
      <!-- Cab Headlight -->
      <rect fill="#FFFFFF" x="424" y="114" width="6" height="10" rx="2" />

      <!-- Truck Wheels -->
      <circle fill="#FFFFFF" cx="142" cy="156" r="16" />
      <circle fill="#0F172A" cx="142" cy="156" r="12" />
      <circle fill="#FFFFFF" cx="142" cy="156" r="6" />

      <circle fill="#FFFFFF" cx="182" cy="153" r="16" />
      <circle fill="#0F172A" cx="182" cy="153" r="12" />
      <circle fill="#FFFFFF" cx="182" cy="153" r="6" />

      <circle fill="#FFFFFF" cx="328" cy="143" r="16" />
      <circle fill="#0F172A" cx="328" cy="143" r="12" />
      <circle fill="#FFFFFF" cx="328" cy="143" r="6" />

      <circle fill="#FFFFFF" cx="395" cy="138" r="16" />
      <circle fill="#0F172A" cx="395" cy="138" r="12" />
      <circle fill="#FFFFFF" cx="395" cy="138" r="6" />
    </g>
  </g>

  <!-- TYPOGRAPHY GROUP -->
  <text x="460" y="152" class="brand-title">
    <tspan fill="#0F172A">We Move </tspan>
    <tspan fill="#C8102E">Mobile Homes</tspan>
  </text>
  <text x="463" y="200" class="brand-subtitle">UK NATIONWIDE &amp; EUROPEAN TRANSPORT</text>
</svg>
