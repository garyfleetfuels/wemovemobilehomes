<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- White Background (Standard for square favicons, or transparent if removing the rect) -->
  <rect width="512" height="512" fill="#FFFFFF" rx="96" />

  <g transform="translate(15, 60) scale(1.05)">
    <!-- Outer Charcoal Swoosh -->
    <path fill="#0F172A" d="M 95,145 C -15,185 -20,310 115,310 C 185,310 265,280 320,245 L 332,272 L 378,188 L 278,196 L 295,215 C 240,245 175,268 115,268 C 28,268 18,195 105,155 Z" />
    
    <!-- Red Main Swoosh Arrow -->
    <path fill="#C8102E" d="M 105,135 C 5,172 0,290 120,290 C 185,290 258,262 312,230 L 322,248 L 362,192 L 282,200 L 296,214 C 245,242 182,262 120,262 C 38,262 30,188 112,146 Z" />

    <!-- Inner Grey Accent Swoosh -->
    <path fill="#64748B" d="M 110,158 C 45,188 42,248 102,258 C 64,242 68,195 118,166 Z" />

    <!-- Road Base Under Truck -->
    <path fill="#0F172A" d="M 75,205 C 145,185 265,155 435,148 C 335,162 215,188 142,228 L 90,228 C 78,225 72,215 75,205 Z" />

    <!-- Flatbed Truck & Static Home (Tilted along road) -->
    <g transform="rotate(-7, 240, 130) translate(0, 15)">
      <!-- Main Roof -->
      <polygon fill="#0F172A" points="100,42 295,4 380,62 368,72 295,20 108,54" />
      <rect fill="#0F172A" x="148" y="16" width="14" height="22" />

      <!-- Left Section (Light Grey) -->
      <polygon fill="#E2E8F0" points="115,50 228,32 228,118 115,128" />
      <rect fill="#0F172A" x="130" y="65" width="28" height="30" />
      <polygon fill="#0F172A" points="172,58 194,56 194,120 172,122" />

      <!-- Middle Section (Grey) -->
      <polygon fill="#64748B" points="228,45 272,20 315,48 315,112 228,118" />
      <polygon fill="#0F172A" points="222,47 272,14 322,49 316,55 272,24 228,52" />
      <rect fill="#FFFFFF" x="248" y="48" width="48" height="40" />

      <!-- Right Gable Section (Red) -->
      <polygon fill="#C8102E" points="315,24 295,12 366,60 366,108 315,112" />
      <rect fill="#FFFFFF" x="330" y="52" width="20" height="34" />

      <!-- Home Base Frame -->
      <polygon fill="#0F172A" points="108,126 364,106 364,114 108,134" />

      <!-- Truck Flatbed & Cab -->
      <path fill="#0F172A" d="M 92,130 L 376,110 L 376,64 L 410,64 C 418,64 426,72 430,86 L 436,112 L 436,136 L 92,158 Z" />
      <!-- Cab Window -->
      <path fill="#FFFFFF" d="M 386,74 L 408,74 C 414,74 418,80 422,92 L 424,102 L 386,96 Z" />
      <!-- Cab Headlight -->
      <rect fill="#FFFFFF" x="426" y="114" width="7" height="11" rx="2" />

      <!-- Truck Wheels -->
      <circle fill="#FFFFFF" cx="145" cy="156" r="18" />
      <circle fill="#0F172A" cx="145" cy="156" r="13" />
      <circle fill="#FFFFFF" cx="145" cy="156" r="6" />

      <circle fill="#FFFFFF" cx="190" cy="153" r="18" />
      <circle fill="#0F172A" cx="190" cy="153" r="13" />
      <circle fill="#FFFFFF" cx="190" cy="153" r="6" />

      <circle fill="#FFFFFF" cx="330" cy="143" r="18" />
      <circle fill="#0F172A" cx="330" cy="143" r="13" />
      <circle fill="#FFFFFF" cx="330" cy="143" r="6" />

      <circle fill="#FFFFFF" cx="398" cy="138" r="18" />
      <circle fill="#0F172A" cx="398" cy="138" r="13" />
      <circle fill="#FFFFFF" cx="398" cy="138" r="6" />
    </g>
  </g>
</svg>
